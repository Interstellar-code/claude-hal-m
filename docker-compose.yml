# Claude HAL-M server for Dokploy (Compose type) or plain `docker compose up -d`.
# The app has no published port: it shares the Tailscale sidecar's network and is
# reached only at https://hal-m.<your tailnet>.ts.net (tailscale serve -> 127.0.0.1:8787).
# Set the variables in Dokploy's Environment tab or in .env (see .env.example).
# Each setting reads HALM_<X>, else the old MNEMOSYNE_<X>.
services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: hal-m
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY to a Tailscale auth key}
      - TS_HOSTNAME=hal-m
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      # Default host folder is the pre-rename one, kept on purpose so existing deployments find their state.
      - ${TS_STATE:-/mnt/cache/appdata/mnemosyne-tailscale}:/var/lib/tailscale
      # A folder, not a single file, so tailscale sees edits to serve.json.
      - ./docker/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  hal-m:
    image: hal-m:local
    build:
      context: .
      args:
        EMBEDDINGS: ${HALM_BUILD_EMBEDDINGS:-${MNEMOSYNE_BUILD_EMBEDDINGS:-1}}
        PUID: ${PUID:-99}
        PGID: ${PGID:-100}
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - HALM_UI_PASSWORD=${HALM_UI_PASSWORD:-${MNEMOSYNE_UI_PASSWORD:?set HALM_UI_PASSWORD (or MNEMOSYNE_UI_PASSWORD), 8+ characters}}
      - HALM_PUBLIC_URL=${HALM_PUBLIC_URL:-${MNEMOSYNE_PUBLIC_URL:-}}
      - HALM_HOSTS=${HALM_HOSTS:-${MNEMOSYNE_HOSTS:-}}
      - HALM_SECURE_COOKIE=${HALM_SECURE_COOKIE:-${MNEMOSYNE_SECURE_COOKIE:-auto}}
      - HALM_EXPIRE_UNUSED_DAYS=${HALM_EXPIRE_UNUSED_DAYS:-${MNEMOSYNE_EXPIRE_UNUSED_DAYS:-90}}
    volumes:
      # Default host folder is the pre-rename one, kept on purpose so an existing deployment keeps the same /data.
      - ${HALM_DATA:-${MNEMOSYNE_DATA:-/mnt/cache/appdata/mnemosyne}}:/data
    restart: unless-stopped
